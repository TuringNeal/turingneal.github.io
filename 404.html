<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到</title>
    <link rel="icon" href="https://raw.githubusercontent.com/TuringNeal/turingneal-website/refs/heads/main/icon.ico">
    <style>
        /* ===== CSS 变量 – 亮色主题 ===== */
        :root {
            --bg: #f7f8fa;
            --card-bg: #ffffff;
            --card-border: #eaeef2;
            --text-primary: #1d2a3a;
            --text-secondary: #3e4e5e;
            --text-muted: #8e9eae;
            --badge-bg: #eef2f6;
            --badge-color: #4a5a6a;
            --btn-border: #d0d8e0;
            --btn-color: #3e4e5e;
            --btn-hover-bg: #f0f3f6;
            --link-color: #5a6a7a;
            --item-border: #eef2f6;
            --label-color: #5a6a7a;
            --value-color: #1d2a3a;
            --rule-bg: #fafbfc;
        }

        /* ===== 暗色主题 ===== */
        [data-theme="dark"] {
            --bg: #1a1e26;
            --card-bg: #242a34;
            --card-border: #313842;
            --text-primary: #e6edf5;
            --text-secondary: #b0c0d0;
            --text-muted: #7a8a9a;
            --badge-bg: #2d3540;
            --badge-color: #b0c0d0;
            --btn-border: #4a5a6a;
            --btn-color: #b0c0d0;
            --btn-hover-bg: #2d3540;
            --link-color: #8a9aaa;
            --item-border: #2d3540;
            --label-color: #9aabbb;
            --value-color: #e6edf5;
            --rule-bg: #1f2630;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 24px;
            transition: background 0.25s ease;
        }

        .card {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 48px 40px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--card-border);
            text-align: center;
            transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        /* ===== 头部（带切换按钮） ===== */
        .header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .theme-toggle button {
            background: transparent;
            border: 1px solid var(--btn-border);
            border-radius: 100px;
            padding: 5px 18px;
            font-size: 14px;
            font-weight: 400;
            color: var(--btn-color);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
            user-select: none;
        }

        .theme-toggle button:hover {
            background: var(--btn-hover-bg);
            border-color: var(--text-muted);
        }

        .theme-toggle button:focus-visible {
            outline: 2px solid var(--text-secondary);
            outline-offset: 2px;
        }

        /* ===== 404 内容 ===== */
        .error-code {
            font-size: 88px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
            margin: 8px 0 12px;
            letter-spacing: -4px;
            transition: color 0.25s ease;
        }

        .error-title {
            font-size: 24px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 20px;
            transition: color 0.25s ease;
        }

        .error-desc {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.6;
            transition: color 0.25s ease;
        }

        /* ===== 返回主页按钮 ===== */
        .home-link {
            display: inline-block;
            padding: 10px 28px;
            border: 1px solid var(--btn-border);
            border-radius: 100px;
            font-size: 15px;
            font-weight: 500;
            color: var(--btn-color);
            background: transparent;
            text-decoration: none;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
            user-select: none;
        }

        .home-link:hover {
            background: var(--btn-hover-bg);
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        .home-link:focus-visible {
            outline: 2px solid var(--text-secondary);
            outline-offset: 2px;
        }

        /* ===== 底部 ===== */
        .footer-note {
            margin-top: 36px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            padding-top: 20px;
            transition: color 0.25s ease, border-color 0.25s ease;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 28px;
            }
            .error-code {
                font-size: 64px;
            }
            .error-title {
                font-size: 20px;
            }
            .home-link {
                padding: 8px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- 头部：仅切换按钮 -->
        <div class="header">
            <div class="theme-toggle">
                <button id="theme-switch" aria-label="切换亮色/暗色模式">亮色</button>
            </div>
        </div>

        <!-- 404 核心内容 -->
        <div class="error-code">404</div>
        <div class="error-title">页面未找到</div>
        <p class="error-desc">
            您访问的页面可能已被移除、更名或暂时不可用。<br>
            请检查网址是否正确，或返回主页继续浏览。
        </p>

        <!-- 返回主页按钮 -->
        <a href="https://turingneal.dpdns.org" class="home-link">返回主页</a>

        <!-- 底部 -->
        <div class="footer-note">
            <span>© 2026 TuringNeal</span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            const root = document.documentElement;
            const switchBtn = document.getElementById('theme-switch');

            function getCurrentTheme() {
                return root.getAttribute('data-theme') || 'light';
            }

            function applyTheme(theme) {
                if (theme === 'dark') {
                    root.setAttribute('data-theme', 'dark');
                    switchBtn.textContent = '暗色';
                } else {
                    root.removeAttribute('data-theme');
                    switchBtn.textContent = '亮色';
                }
                localStorage.setItem('theme', theme);
            }

            function toggleTheme() {
                const current = getCurrentTheme();
                const next = (current === 'light') ? 'dark' : 'light';
                applyTheme(next);
            }

            function init() {
                const stored = localStorage.getItem('theme');
                let theme = 'light';
                if (stored === 'dark' || stored === 'light') {
                    theme = stored;
                }
                applyTheme(theme);
                switchBtn.addEventListener('click', toggleTheme);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
